# main に push されたら、テスト → ビルドして GitHub Pages 用リポジトリ（asobitagari/sansu-app）へ反映する
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --base-href /sansu-app/

      # SPA の直リンク・再読み込み対策と、Jekyll の処理を止める
      - name: Prepare pages files
        run: |
          cp dist/sansu-app/browser/index.html dist/sansu-app/browser/404.html
          touch dist/sansu-app/browser/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: asobitagari/sansu-app
          publish_branch: main
          publish_dir: dist/sansu-app/browser
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: deploy ${{ github.sha }}
